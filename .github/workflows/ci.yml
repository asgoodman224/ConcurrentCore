# Continuous integration: Linux (primary target) with GCC and Clang, plus
# ThreadSanitizer and AddressSanitizer/UBSan jobs, and a Windows MinGW build.
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizer: ""
          - name: clang-release
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizer: ""
          - name: clang-tsan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            sanitizer: thread
          - name: clang-asan-ubsan
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            sanitizer: "address;undefined"
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCC_SANITIZER=${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -j 2
      - name: Benchmark smoke test
        if: matrix.sanitizer == ''
        run: ./build/bin/concurrentcore-bench --quick --csv quick.csv --markdown quick.md

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
